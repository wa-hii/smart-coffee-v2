; B5 STATIC stack-usage compiler diagnostic. Does not modify the approved
; standalone build and NEVER uploads to any hardware.
; LTO disabled deliberately so avr-g++ can emit nonempty .su files.
[env:svm30_stack_diagnostic]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    robtillaart/ADS1X15@^0.3.13
build_unflags =
    -flto
build_flags =
    -DENABLE_AVR_SVM30=1
    -DSMART_COFFEE_STANDALONE_SVM30=1
    -DENABLE_PI_RF30_RETURN=0
    -DENABLE_MANUAL_ACTUATOR_TESTS=0
    -DUSE_ON_DEVICE_INFERENCE=0
    -fstack-usage
