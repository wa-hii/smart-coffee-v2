; Compile-only release-gate-enabled candidate, never flash automatically.
; DOES NOT alter the local platformio.ini or COM port settings.
; Use: pio run -e rf30_return_bench -c scripts/platformio_rf30_bench.ini

[env:rf30_return_bench]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    robtillaart/ADS1X15@^0.3.13
build_flags =
    -DENABLE_PI_RF30_RETURN=1
