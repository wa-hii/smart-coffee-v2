; BUILD-ONLY diagnostic, NOT a firmware release.
; Does not use RF500, sensors or I2C, EEPROM or pump.
; DO NOT upload before independent Flash+EEPROM backup of SECOND PCB
; and explicit verification of actuator-off pins D10 and D11.
[platformio]
src_dir = diagnostics/uart_nextion/src

[env:uart_nextion_diag]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -DUSART_BOOT_DIAG_ONLY=1
