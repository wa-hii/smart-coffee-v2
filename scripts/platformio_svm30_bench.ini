; Compile-only ATmega2560 model memory feasibility; DO NOT UPLOAD.
; Contains user-provided model coefficients in ignored private/ (never Git).
; Run from project root:
;   pio run -c scripts/platformio_svm30_bench.ini -e svm30_avr_compile
[env:svm30_avr_compile]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    -DENABLE_AVR_SVM30=1
build_src_filter =
    -<*>
    +<embedded_svm30_features.cpp>
    +<embedded_svm30_classifier.cpp>
    +<../test/svm30_avr_compile.cpp>
