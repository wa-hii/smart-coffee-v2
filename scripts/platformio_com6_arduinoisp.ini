; ArduinoISP untuk programmer Arduino Mega 2560 CH340 di COM6.
; PENTING: pio run -c scripts/platformio_com6_arduinoisp.ini -e mega_as_isp
; hanya BUILD, bukan upload. Upload mengganti sketch Arduino Mega COM6
; dan harus dilakukan setelah izin penimpaan sketch serta SOP.
; COM11 adalah target E-Nose, BUKAN port programmer.
[platformio]
src_dir = diagnostics/com12_arduinoisp/src
build_dir = private/com6_mega_isp/build

[env:mega_as_isp]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_protocol = wiring
upload_port = COM6
upload_speed = 115200
monitor_port = COM6
monitor_speed = 19200
