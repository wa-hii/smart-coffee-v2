; Persiapan programmer: hanya compile via pio run -c ... -e mega_as_isp.
; Arduino Mega CH340: COM12. PCB target FT232R: COM11.
; File resmi ArduinoISP.ino dalam private/com12_arduino_isp/vendor
; diambil dari Arduino Examples melalui fetch_com12_arduinoisp_official.py.
; Wrapper src/main.cpp menegaskan RESET D10, SPI D50-52, baud 19200.
; Pengunggahan sketch mengganti program yang sudah ada di Mega COM12.
[platformio]
src_dir = diagnostics/com12_arduinoisp/src

[env:mega_as_isp]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_protocol = wiring
upload_port = COM12
upload_speed = 115200
monitor_port = COM12
monitor_speed = 19200
