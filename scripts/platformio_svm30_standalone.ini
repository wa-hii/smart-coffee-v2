; Standalone 30-cycle SVM backup. COMPILE ONLY; never auto-upload.
; Model parameters must exist in private/embedded_svm30_model.h
; and remain excluded from public Git. This file is independent
; of the user's modified root platformio.ini and physical USB.
[env:svm30_standalone]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    robtillaart/ADS1X15@^0.3.13
build_flags =
    -DENABLE_AVR_SVM30=1
    -DSMART_COFFEE_STANDALONE_SVM30=1
    -DENABLE_PI_RF30_RETURN=0
    -DENABLE_MANUAL_ACTUATOR_TESTS=0
    -DUSE_ON_DEVICE_INFERENCE=0
    -fstack-usage
