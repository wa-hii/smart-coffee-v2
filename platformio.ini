; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
    robtillaart/ADS1X15@^0.3.13
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3

; ─── Nextion Communication Test ──────────────────────────────────────────────
; Compile & upload : pio run -e nextion_test -t upload
; Serial monitor   : pio device monitor -e nextion_test
; Revert to main   : pio run -e mega2560 -t upload
[env:nextion_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = -<*> +<../test/nextion_test.cpp>
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
